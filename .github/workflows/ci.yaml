name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  Initial-Checks:
    runs-on: ubuntu-latest
    steps:
      - name: Log run info
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Source branch: ${{ github.head_ref || github.ref_name }}"

  terraform-checks:
    needs: Initial-Checks
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact

      - name: Terraform plan
        run: terraform plan -no-color

  snyk-checks:
    needs: Initial-Checks
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk IaC scan (Terraform)
        run: snyk iac test --severity-threshold=high

      - name: Snyk Code scan (SAST on Lambda code)
        run: snyk code test --severity-threshold=high

  summary:
    needs: [terraform-checks, snyk-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| terraform-checks | ${{ needs.terraform-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| snyk-checks | ${{ needs.snyk-checks.result }} |" >> $GITHUB_STEP_SUMMARY